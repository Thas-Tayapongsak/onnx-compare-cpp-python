[project]
name = "py-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thas-Tayapongsak", email = "hwunhwun@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "psutil>=7.2.2",
]

[project.scripts]
py-pipeline = "py_pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "ruff>=0.17.1",
    "types-psutil>=7.2.2.20260906",
]

[tool.pyrefly]
project-includes = ["src"]
search-path = ["src"]
python-version = "3.12"
preset = "default"
